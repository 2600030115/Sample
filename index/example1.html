
<!DOCTYPE html>
<html>
<head>
    <title>Example 1</title>
    <link rel="stylesheet" href="example1.css">
</head>
<body>
    <div class="container">
        <header>
            <h2>HEADER</h2>
            <p>Logo | Search | Login | Cart</p>
        </header>
        <nav>
            <h2>NAVIGATION</h2>
            <p>Home | Products | Offers | Contact</p>
        </nav>
        <main>
            <h2>MAIN CONTENT</h2>
            <article class="product">
                Product 1
            </article>
            <article class="product">
                Product 2
            </article>
        </main>
        <aside>
            <h2>SIDEBAR</h2>
            <p>Offers</p>
        </aside>
        <footer>
            <h2>FOOTER</h2>
            <p>Contact | Privacy | Copyright</p>
        </footer>
    </div>
</body>
</html>
